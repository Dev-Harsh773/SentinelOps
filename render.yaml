# Review before importing: this creates PAID compute and persistent storage.
# Deployment remains manual; the user reviews and pushes the release first.
services:
  - type: web
    name: sentinelops
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /ready
    disk:
      name: sentinelops-data
      mountPath: /var/lib/sentinelops
      sizeGB: 1
    envVars:
      - key: SENTINELOPS_OPERATOR_TOKEN
        sync: false
      - key: APP_ENV
        value: production
      - key: RUNTIME_DIR
        value: /var/lib/sentinelops
      - key: WATCHER_ENABLED
        value: 'false'
      - key: LOG_JSON
        value: 'true'
      - key: LLM_PROVIDER
        value: mock
