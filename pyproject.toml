[build-system]
requires = ["setuptools>=65.0.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelops"
version = "0.20.0"
description = "AI-assisted software reliability and incident-response platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SentinelOps Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "PyQt6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]
build = [
    "build>=1.0.0",
    "wheel>=0.40.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
sentinelops = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "desktop*"]
exclude = ["tests*", "android*", "runtime*", "demo_app*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md"]
